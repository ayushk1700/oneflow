<!doctype html>
<html lang="en" data-theme="dark" data-view="home">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>ONEFLOW · Your space to focus</title>
  <link rel="icon" href="../assets/icons/icon-32.png">
  <link rel="stylesheet" href="app.css">
  <link rel="modulepreload" href="../core/storage.js">
  <link rel="modulepreload" href="../core/schema.js">
  <link rel="modulepreload" href="../core/i18n.js">
  <link rel="modulepreload" href="../core/ui.js">
  <link rel="modulepreload" href="../components/session-view/index.js">
  <script type="module" src="newtab.js"></script>
</head>
<body>
  <div id="landscape" aria-hidden="true"></div><div class="readability" aria-hidden="true"></div>
  <a class="skip-link" href="#main">Skip to dashboard</a>
  <header class="topbar flex items-center justify-between gap-4">
    <button id="focus-exit" class="focus-exit" type="button" aria-label="Exit Focus Mode" aria-keyshortcuts="Escape"><span aria-hidden="true"></span><span>Exit Focus</span></button>
    <button id="journal-button" class="journal-launch" data-tool="journal" type="button" aria-label="Journal" aria-haspopup="dialog" aria-expanded="false" hidden></button>
  </header>
  <main id="main" class="home-layout" tabindex="-1">
    <section class="centerpiece" aria-label="Your daily dashboard">
      <div id="clock"></div>
      <div id="focus"></div>
      <div id="search"></div>
      <div id="quotes"></div>
      <div id="timer"></div>
    </section>
  </main>
  <footer class="home-footer">
    <div id="photo-attribution" class="photo-attribution"></div>
    <div id="audio-status" hidden></div>
    <div class="bottom-row">
      <div class="tool-cluster"><nav id="dock" class="dock" aria-label="Primary tools"></nav>
      <details id="home-menu" class="home-menu">
        <summary aria-label="More" title="More"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></summary>
        <section class="home-menu-body" aria-label="More">
          <h2>More</h2>
          <nav id="view-switcher" aria-label="Dashboard view"><button type="button" data-view="ambient" aria-label="Ambient view" aria-pressed="false">Ambient</button><button type="button" data-view="home" aria-label="Home view" aria-pressed="true">Home</button><button type="button" data-view="focus" aria-label="Focus view" aria-pressed="false">Focus</button></nav>
          <div class="menu-actions">
            <button id="settings-button" class="menu-setting" type="button" aria-label="Personalization" title="Personalization" aria-haspopup="dialog"><span aria-hidden="true"></span><span><strong>Personalization</strong><small>Theme, wallpaper, layout & Ambient</small></span><span aria-hidden="true">›</span></button>
            <button id="extension-settings-button" class="menu-setting" type="button" aria-label="Extension settings" title="Extension settings" aria-haspopup="dialog"><span aria-hidden="true"></span><span><strong>Extension settings</strong><small>Focus, reminders, blocking & data</small></span><span aria-hidden="true">›</span></button>
          </div>
          <div class="menu-utilities" role="group" aria-label="Tools and display">
            <button id="fullscreen-button" type="button" aria-label="Enter fullscreen" title="Enter fullscreen">Fullscreen</button>
            <button id="shortcuts-button" type="button" aria-label="Keyboard shortcuts">Shortcuts</button>
            <button id="more-tools-button" type="button" aria-label="Open all tools" aria-haspopup="dialog">All tools</button>
          </div>
          <div class="scene-caption"><button id="background-button" class="landscape-credit" type="button" aria-label="Change scenery"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m3 19 6-10 4 6 3-4 5 8Z"/><circle cx="16" cy="5" r="2"/></svg><span id="landscape-name">The quiet Alps</span></button></div>
          <div class="top-right"><div class="top-actions"><div id="weather"></div></div></div>
          <details class="dashboard-extras"><summary>Quick links & dates</summary><div id="links"></div><div id="countdowns"></div></details>
          <a class="brand" href="index.html" aria-label="ONEFLOW home"><svg width="32" height="26" viewBox="0 0 32 26" fill="none" aria-hidden="true"><path d="M2 18C7 5 12 5 16 13S25 23 30 8M2 24C7 11 12 11 16 19S25 29 30 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>ONEFLOW</span></a>
        </section>
      </details>
      </div>
    </div>
  </footer>
  <button id="ambient-session" class="ambient-session" type="button" hidden aria-label="Return to focus session"></button>
  <dialog id="panel" aria-labelledby="panel-title"><header class="panel-header"><div><span class="eyebrow">YOUR SPACE</span><h2 id="panel-title" tabindex="-1"></h2></div><button id="close-panel" class="icon-button" type="button" aria-label="Close panel">✕</button></header><nav id="panel-nav" aria-label="Switch dashboard tool"></nav><div id="panel-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden><span id="toast-message"></span><button id="toast-close" class="icon-button" type="button" aria-label="Dismiss notification" title="Dismiss notification">×</button></div>
  <noscript>ONEFLOW needs JavaScript enabled to save and display your dashboard.</noscript>
</body>
</html>
